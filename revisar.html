<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Revisar encuadre — Ambilor.Lab</title>
<!--
  Pagina de verificacion (Ambilor.Lab, 2026-09-28). No esta enlazada en el
  menu. Muestra el sitio al mismo tiempo en 6 tamanos (celular, tablet y
  computador, en vertical y horizontal) y corre en cada uno un chequeo
  automatico: contenido que se sale de la pantalla, textos cortados, vacio
  bajo el pie de pagina y si los bloques principales caben en el alto visible.
-->
<style>
  :root{--fondo:#0B0F16;--panel:#131a24;--borde:#253042;--texto:#dce4ee;--suave:#8a98ab;--ok:#3fbf7f;--aviso:#f0a33a;--azul:#4c8ddb}
  @media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--fondo:#f3f6fa;--panel:#fff;--borde:#d9e1ea;--texto:#12304d;--suave:#5b6f86}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--fondo);color:var(--texto);font:14px/1.5 Inter,system-ui,sans-serif}
  header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--borde)}
  h1{font-size:15px;margin:0 8px 0 0}
  .tabs{display:flex;flex-wrap:wrap;gap:6px}
  button{font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--borde);background:transparent;color:var(--texto);cursor:pointer}
  button.on{background:var(--azul);border-color:var(--azul);color:#fff}
  button:disabled{opacity:.55;cursor:progress}
  #resumen{margin-left:auto;font-weight:600}
  main{display:flex;flex-wrap:wrap;gap:18px;padding:16px;align-items:flex-start}
  .disp{background:var(--panel);border:1px solid var(--borde);border-radius:12px;padding:10px}
  .disp h2{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;margin:0 0 6px}
  .disp h2 span{color:var(--suave);font-weight:500}
  .marco{overflow:hidden;border-radius:6px;border:1px solid var(--borde);background:#fff}
  iframe{border:0;transform-origin:0 0;display:block}
  .estado{margin-top:8px;font-size:12px;line-height:1.45;max-width:100%}
  .estado b.ok{color:var(--ok)} .estado b.av{color:var(--aviso)}
  .estado ul{margin:4px 0 0;padding-left:16px;color:var(--suave)}
  /* ventanas bajas o angostas (celular, pantalla dividida): la cabecera no queda fija */
  @media (max-height:560px),(max-width:640px){header{position:static}}
  .disp{max-width:100%}
</style>
</head>
<body>
<header>
  <h1>Revisar encuadre</h1>
  <div class="tabs" id="tabs"></div>
  <button id="rehacer">Volver a revisar</button>
  <button data-grupo="">Pantalla completa</button>
  <button data-grupo="dividida">Pantalla dividida</button>
  <button data-grupo="ventana">Ventana iPad</button>
  <span id="resumen">Revisando…</span>
</header>
<main id="main"></main>
<script>
// Cada dispositivo se prueba con varios altos visibles: el de Safari y el de
// Chrome / Edge (sus barras ocupan mas alto), del mayor al menor.
const COMPLETA = [
  ['iPhone vertical', 402, [700, 640]], ['iPhone horizontal', 874, [290, 260]],
  ['iPad vertical', 834, [1050, 980]], ['iPad horizontal', 1194, [738, 660]],
  ['Computador', 1440, [860, 740]], ['Monitor vertical', 1080, [1700, 1600]]
];
// Pantalla dividida (revisar.html?dividida): iPad con Split View y Slide Over,
// y computador con la ventana a la mitad de la pantalla.
const DIVIDIDA = [
  ['iPad horiz. ⅓ / Slide Over', 375, [738, 660]], ['iPad horiz. ½', 590, [738, 660]],
  ['iPad horiz. ⅔', 809, [738, 660]], ['iPad vert. ⅓', 320, [1050, 980]],
  ['iPad vert. ⅔', 504, [1050, 980]], ['Computador ½', 720, [860, 740]],
  ['Monitor ½', 960, [1000, 900]]
];
// Ventana libre de iPad (Stage Manager / ventanas redimensionables): cualquier
// tamano intermedio, incluidas ventanas chicas en ancho y en alto a la vez.
const VENTANA = [
  ['Ventana mínima', 400, [400]], ['Ventana 480 × 360', 480, [360]],
  ['Ventana 560 × 440', 560, [440]], ['Ventana 640 × 480', 640, [480]],
  ['Ventana 720 × 560', 720, [560]], ['Ventana 860 × 620', 860, [620]],
  ['Ventana alta 380 × 640', 380, [640]], ['Ventana alta 520 × 760', 520, [760]]
];
const PARAMS = new URLSearchParams(location.search);
// ?tam=500x450,700x520 revisa tamanos a medida
const A_MEDIDA = (PARAMS.get('tam') || '').split(',').map(t => t.split('x').map(Number)).filter(([w, h]) => w > 0 && h > 0).map(([w, h]) => [w + ' × ' + h, w, [h]]);
const GRUPO = A_MEDIDA.length ? 'medida' : PARAMS.has('ventana') ? 'ventana' : PARAMS.has('dividida') ? 'dividida' : 'completa';
const MODO_DIVIDIDA = GRUPO === 'dividida';
const DISPOSITIVOS = { completa: COMPLETA, dividida: DIVIDIDA, ventana: VENTANA, medida: A_MEDIDA }[GRUPO];
const NOMBRE_GRUPO = { completa: '', dividida: ' de pantalla dividida', ventana: ' de ventana iPad', medida: ' a medida' }[GRUPO];
const PESTANAS = [['home','Inicio'],['about','Sobre mí'],['product','Herramientas'],['guias','Guías'],['contact','Contacto']];
const ALTO_VISTA = 330;   // alto en pantalla de cada vista previa
let actual = 'home';

const tabs = document.getElementById('tabs');
PESTANAS.forEach(([id, nombre]) => {
  const b = document.createElement('button'); b.textContent = nombre; b.dataset.id = id;
  if (id === actual) b.classList.add('on');
  b.onclick = () => { if (revisando) return; actual = id; [...tabs.children].forEach(x => x.classList.toggle('on', x === b)); revisarTodo(); };
  tabs.appendChild(b);
});

const main = document.getElementById('main');
const vistas = DISPOSITIVOS.map(([nombre, w, altos]) => {
  const h = altos[0];
  // la vista previa nunca es más ancha que la pantalla (celular o pantalla dividida)
  const k = Math.min(ALTO_VISTA / Math.max(h, 600), (Math.min(innerWidth, document.documentElement.clientWidth) - 56) / w);
  const caja = document.createElement('div'); caja.className = 'disp';
  caja.innerHTML = `<h2>${nombre} <span>${w} × ${altos.join(' / ')}</span></h2><div class="marco" style="width:${Math.round(w*k)}px;height:${Math.round(h*k)}px"><iframe width="${w}" height="${h}" style="transform:scale(${k})" src="index.html?revisar=${Date.now()}"></iframe></div><div class="estado">Cargando…</div>`;
  caja.style.width = Math.max(Math.round(w*k) + 22, 200) + 'px';
  main.appendChild(caja);
  const iframe = caja.querySelector('iframe');
  const listo = new Promise(r => iframe.addEventListener('load', () => setTimeout(r, 1200), { once:true }));
  return { nombre, w, h, altos, iframe, estado: caja.querySelector('.estado'), listo };
});

// Chequeo dentro de cada vista (misma lógica que la revisión manual)
async function revisar(v){
  await v.listo;
  const todos = [];
  for (const alto of v.altos) {
    v.iframe.height = alto;
    await new Promise(r => setTimeout(r, 500));
    // Si algo no cuadra se mide otra vez tras una pausa: justo despues de cambiar
    // el alto de la vista, una transicion en curso puede dar una lectura falsa.
    let avisos = await revisarAlto(v, alto);
    if (avisos.length) { await new Promise(r => setTimeout(r, 900)); avisos = await revisarAlto(v, alto); }
    avisos.forEach(a => todos.push(v.altos.length > 1 ? `[alto ${alto}] ${a}` : a));
  }
  v.iframe.height = v.altos[0];
  v.estado.innerHTML = todos.length
    ? `<b class="av">⚠ ${todos.length} aviso${todos.length > 1 ? 's' : ''}</b><ul>${todos.map(a => `<li>${a}</li>`).join('')}</ul>`
    : `<b class="ok">✓ Todo encuadrado (${v.altos.join(' y ')} px de alto)</b>`;
  return todos.length;
}
async function revisarAlto(v, H){
  const win = v.iframe.contentWindow, doc = v.iframe.contentDocument;
  const esperar = ms => new Promise(r => setTimeout(r, ms));
  win.show(actual); await esperar(700);
  doc.querySelectorAll('.rv,.rv2').forEach(e => e.classList.add('in'));
  const W = v.w, sec = doc.getElementById(actual), avisos = [];
  const fuera = new Set(), cortados = new Set();
  sec.querySelectorAll('*').forEach(e => {
    const r = e.getBoundingClientRect(); if (!r.width || !r.height) return;
    const cs = win.getComputedStyle(e); if (cs.visibility === 'hidden' || cs.position === 'fixed' || cs.display === 'none') return;
    if ((r.right > W + 1 || r.left < -1) && e.tagName !== 'CANVAS' && !e.closest('.hx-canvas')) fuera.add(e.className && typeof e.className === 'string' ? e.className.split(' ')[0] : e.tagName);
    if (!e.children.length && e.textContent.trim() && (cs.overflow === 'hidden' || cs.overflowX === 'hidden' || cs.textOverflow === 'ellipsis')) { const rg = doc.createRange(); rg.selectNodeContents(e); const tw = rg.getBoundingClientRect().width; if (tw > e.clientWidth + 2) cortados.add(e.textContent.trim().slice(0, 28)); }
  });
  if (fuera.size) avisos.push('Se sale de la pantalla: ' + [...fuera].slice(0, 3).join(', '));
  // errores de código registrados por la página (sin contar límites de 3D por tener 6 vistas abiertas)
  const errores = (win.__errores || []).filter(m => !/webgl|context|ResizeObserver/i.test(m));
  if (errores.length) avisos.push('Error de código: ' + [...new Set(errores)].slice(0, 2).join(' · '));
  // alineación: nada debe salirse de la columna de contenido (regla 1: un solo ancho)
  const desal = new Set();
  sec.querySelectorAll('.container, .hx-wrap').forEach(c => {
    const cr = c.getBoundingClientRect(), cs = win.getComputedStyle(c);
    const izq = cr.left + parseFloat(cs.paddingLeft), der = cr.right - parseFloat(cs.paddingRight);
    c.querySelectorAll(':scope > *, :scope > * > *').forEach(e => {
      const r = e.getBoundingClientRect(), es = win.getComputedStyle(e);
      if (!r.width || es.position === 'absolute' || es.position === 'fixed' || es.display === 'none') return;
      if (r.left < izq - 1 || r.right > der + 1) desal.add(typeof e.className === 'string' && e.className ? e.className.split(' ')[0] : e.tagName);
    });
  });
  if (desal.size) avisos.push('Fuera de la columna de contenido: ' + [...desal].slice(0, 3).join(', '));
  // proporción: ningún dibujo o imagen debe ser más alto que el 60% de la pantalla
  const grandes = new Set();
  sec.querySelectorAll('svg, img').forEach(e => {
    const r = e.getBoundingClientRect();
    if (r.height > H * 0.6 && r.width > 60) grandes.add((e.getAttribute('class') || e.tagName).split(' ')[0] + ' ' + Math.round(r.height) + 'px');
  });
  if (grandes.size) avisos.push('Dibujo demasiado grande: ' + [...grandes].slice(0, 3).join(', '));
  // controles del cubo dentro del inicio
  if (cortados.size) avisos.push('Texto cortado: ' + [...cortados].slice(0, 2).join(' · '));
  const pie = doc.querySelector('footer').getBoundingClientRect();
  const vacio = Math.round(H - (pie.bottom + win.scrollY));
  if (vacio > 4) avisos.push('Vacío bajo el pie: ' + vacio + ' px');
  // bloques que deben caber en el alto visible
  const cabe = (nombre, alto) => { if (alto > H + 2) avisos.push(`${nombre} no cabe: ${Math.round(alto)} de ${H} px`); };
  // Inicio (recorrido 3D): cada bloque debe caber en el alto visible bajo la barra
  if (actual === 'home') {
    const barra = doc.querySelector('nav').getBoundingClientRect().height;
    doc.querySelectorAll('#home .i3-estacion').forEach(e => cabe('Bloque "' + ((e.querySelector('.i3-eyebrow') || {}).textContent || '').trim() + '"', e.offsetHeight + barra));
  }
  // escenas del inicio: en tablet y computador cada una debe caber completa en la pantalla
  // En ventanas de ancho de celular y menos de 500px de alto (ventana minima de
  // iPad) la demo no cabe entera: se revisa que no se salga ni se corte, no el alto.
  if (actual === 'product' && !(W < 640 && H < 500)) doc.querySelectorAll('.al-demo').forEach(d => cabe('Demo "' + d.id + '"', d.getBoundingClientRect().bottom - d.previousElementSibling.getBoundingClientRect().top));
  // (en horizontal bajo, como el iPhone girado, la demo cabe sola pero no junto al titulo: se revisa solo la demo)
  if (actual === 'product' && ((W >= 900 && W > H && H > 560) || W < H)) { win.scrollTo(0, 0); cabe('Encabezado + demo "Ver en acción"', doc.getElementById('ver-en-accion').getBoundingClientRect().bottom + win.scrollY); }
  if (actual === 'guias') { const g = doc.querySelector('.gp-panel.on'); if (g && g.querySelector('.gp-prog')) cabe('Paso de la guía', g.querySelector('.gp-ctrl').getBoundingClientRect().bottom - g.querySelector('.gp-prog').getBoundingClientRect().top); }
  // Guías: desde el comienzo de la página hasta los botones del paso, en la primera pantalla
  if (actual === 'guias' && H >= 500) {
    let peor = 0;
    for (const [i, panel] of [...doc.querySelectorAll('.gp-panel')].entries()) {
      doc.querySelectorAll('.gp-tab')[i].click(); await esperar(150);
      for (const b of panel.querySelectorAll('.gp-prog button')) { b.click(); await esperar(120); win.scrollTo(0, 0); peor = Math.max(peor, panel.querySelector('.gp-ctrl').getBoundingClientRect().bottom); }
      panel.querySelector('.gp-prog button').click();
    }
    doc.querySelectorAll('.gp-tab')[0].click();
    cabe('Guía completa desde el comienzo (peor paso de las 3 guías)', peor);
  }
  // la página no debe mover sola el desplazamiento (sin encaje forzado)
  win.scrollTo({ top: 150, behavior: 'instant' }); await esperar(700);
  if (Math.abs(win.scrollY - 150) > 25 && doc.documentElement.scrollHeight > H + 200) avisos.push('La página mueve sola el desplazamiento (pedido 150, quedó ' + Math.round(win.scrollY) + ')');
  win.scrollTo(0, 0);
  return avisos;
}
// Una revisión a la vez: si se cambia de pestaña o se pulsa "Volver a revisar"
// mientras otra corre, las dos usan los mismos iframes y se mezclan los avisos.
let revisando = false;
function bloquear(si){ revisando = si; document.querySelectorAll('header button').forEach(b => b.disabled = si); }
async function revisarTodo(){
  if (revisando) return;
  bloquear(true);
  const res = document.getElementById('resumen'); res.textContent = 'Revisando…';
  vistas.forEach(v => v.estado.textContent = 'Revisando…');
  let n;
  try { n = await Promise.all(vistas.map(revisar)); }
  catch (e) { res.textContent = '⚠ La revisión falló: ' + e.message; return; }
  finally { bloquear(false); }
  const total = n.reduce((a, b) => a + b, 0);
  res.textContent = total ? `⚠ ${total} aviso${total > 1 ? 's' : ''} en ${PESTANAS.find(p => p[0] === actual)[1]}` : `✓ ${PESTANAS.find(p => p[0] === actual)[1]}: todo encuadrado en los ${DISPOSITIVOS.length} tamaños${NOMBRE_GRUPO} (altos de Safari, Chrome y Edge)`;
}
document.getElementById('rehacer').onclick = revisarTodo;
document.querySelectorAll('header [data-grupo]').forEach(b => {
  const g = b.dataset.grupo || 'completa';
  b.classList.toggle('on', g === GRUPO);
  b.onclick = () => { location.search = b.dataset.grupo ? '?' + b.dataset.grupo : ''; };
});
revisarTodo();
</script>
</body>
</html>
