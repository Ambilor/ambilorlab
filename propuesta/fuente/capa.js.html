    document.querySelectorAll('#product .al-demo').forEach(function(d){
      var st = d.querySelector('.al-demo__stage'), k = d.querySelector('.al-demo__kicker'); if (!st || !k || st.querySelector('.p-paso')) return;
      var e = document.createElement('div'); e.className = 'p-paso'; e.setAttribute('aria-hidden', 'true'); st.appendChild(e);
      var poner = function(){ var t = k.textContent.trim(); if (t === e.textContent) return; e.classList.add('cambia'); setTimeout(function(){ e.textContent = t; e.classList.remove('cambia'); }, 180); };
      poner(); new MutationObserver(poner).observe(k, { childList: true, characterData: true, subtree: true });
    });
  }
  // 4 · resumen al final: los pasos del demo y qué hacer después (el texto completo queda para el final)
  function resumenes(){
    document.querySelectorAll('#product .al-demo').forEach(function(d){
      var st = d.querySelector('.al-demo__stage'), fb = d.querySelectorAll('.al-demo__fblist > li');
      if (!st || !fb.length || st.querySelector('.p-resumen')) return;
      var r = document.createElement('div'); r.className = 'p-resumen';
      var h = '<p class="p-resumen__k">Así funciona</p><ol>';
      fb.forEach(function(li, i){ var t = li.querySelector('.al-demo__fbt'); h += '<li><button type="button" data-i="' + i + '">' + (t ? t.textContent : '') + '</button></li>'; });
      h += '</ol><div class="p-resumen__acc"><button type="button" class="p-resumen__otra">↻ Ver de nuevo</button></div>';
      r.innerHTML = h; st.appendChild(r);
      var cta = d.querySelector('.al-demo__fallback .al-demo__cta') || d.querySelector('.al-demo__cta');
      if (cta) { var a = cta.cloneNode(true); a.className = 'p-resumen__cta'; r.querySelector('.p-resumen__acc').appendChild(a); }
      r.querySelector('.p-resumen__otra').addEventListener('click', function(){ var b = d.querySelector('[data-act="restart"]'); if (b) b.click(); });
      r.querySelectorAll('ol button').forEach(function(b){ b.addEventListener('click', function(){ var s = d.querySelectorAll('.al-demo__step')[+b.getAttribute('data-i')]; if (s) s.click(); var p = d.querySelector('[data-act="play"]'); if (p && d.classList.contains('al-demo--manual')) p.click(); }); });
    });
  }
  // subtítulo del demo: la frase del paso (fuente/notas.js) bajo el demo, sin tapar la pantalla
  function subtitulos(){
    document.querySelectorAll('#product .al-demo').forEach(function(d){
      var N = window.AL_NOTAS && AL_NOTAS[d.id], st = d.querySelector('.al-demo__stage'); if (!N || !st || d.querySelector('.p-nota')) return;
      var e = document.createElement('p'); e.className = 'p-nota'; e.setAttribute('aria-live', 'polite'); st.insertAdjacentElement('afterend', e);
      var poner = function(){ var b = d.querySelectorAll('.al-demo__step'), i = 0; b.forEach(function(x, j){ if (x.getAttribute('aria-current') === 'step') i = j; });
        var t = N[i] || ''; if (t === e.textContent) return; e.classList.add('cambia'); setTimeout(function(){ e.textContent = t; e.classList.remove('cambia'); }, 160); };
      poner(); new MutationObserver(poner).observe(d, { subtree: true, attributes: true, attributeFilter: ['aria-current'] });
    });
  }
  function etiquetasYResumen(){ etiquetas(); resumenes(); subtitulos(); }
  etiquetasYResumen(); window.addEventListener('load', etiquetasYResumen); setInterval(etiquetasYResumen, 2000);

  /* engancha el cambio de pestaña sin tocar show() */
  var showOrig = window.show;
  if (typeof showOrig === 'function') {
    window.show = function(id){
      var r = showOrig.apply(this, arguments);
      corte(id);
      if (id === 'about') sobreMi();
      if (id === 'product') { setTimeout(trazos, 50); demos(); }
      if (id === 'guias') setTimeout(recursos, 30);
      if (id === 'home') { portada(); setTimeout(descifrar, 1100); }
      tituloDe(id);
      return r;
    };
  }
  function alInicio(){
    var v = document.querySelector('section.visible'); var id = v && v.id;
    tituloDe(id);
    if (id === 'home') { portada(); setTimeout(descifrar, 1100); } else if (id === 'about') sobreMi(); else if (id === 'product') { trazos(); demos(); } else if (id === 'guias') recursos();
  }
  // la portada espera a que la página termine de cargar (el 3D ocupa el primer segundo);
  // si tarda más de 3 s, se muestra sin animación
  var listo = false;
  function arrancar(){ if (listo) return; listo = true; requestAnimationFrame(function(){ requestAnimationFrame(alInicio); }); }
  if (document.readyState === 'complete') arrancar(); else window.addEventListener('load', arrancar);
  setTimeout(function(){ if (!listo) { document.documentElement.classList.remove('prop-intro'); arrancar(); } }, 3000);
})();
</script>
