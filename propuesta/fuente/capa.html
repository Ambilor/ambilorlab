/* ════ PROPUESTA C: el demo de Herramientas ════════════════════════════════════ */
@property --p-ang{syntax:'<angle>';inherits:false;initial-value:0deg}

.al-demo__stage::after{content:'';position:absolute;inset:0;border-radius:inherit;padding:2px;pointer-events:none;z-index:4;
  background:conic-gradient(from var(--p-ang),transparent 0 55%,rgba(76,141,219,.0) 60%,#4C8DDB 72%,#BFE0FF 78%,#35B37E 86%,transparent 96%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  animation:p-gira 3.6s linear infinite;transition:opacity .4s ease}
.al-demo--manual .al-demo__stage::after{opacity:.25;animation-play-state:paused}

.al-sim__evt{transition:opacity .2s ease,transform .55s linear(0,.35 12%,.82 26%,1.06 40%,1.08 48%,1.02 62%,.99 76%,1)!important;box-shadow:0 10px 30px -8px rgba(36,122,80,.8)}

/* ════ PROPUESTA D: sensación de cine ═══════════════════════════════════════════ */
/* D0 · marco del demo: menos redondeado y anillo de luz más fino */
.al-demo__stage{border-radius:6px!important}

/* D1 · capas de lente sobre la escena: viñeta, grano vivo y destello de luz */
.p-lente{position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:inherit;
  background:radial-gradient(120% 95% at 50% 45%,transparent 55%,rgba(6,12,22,.38) 100%)}

/* ════ PROPUESTA F: grabación de pantalla pro ═════════════════════════════════════ */
/* fondo de estudio: degradado de la marca detrás del laptop / teléfono */
.al-demo__stage{background-color:#0B1F35!important;background-image:radial-gradient(70% 60% at 28% 18%,rgba(76,141,219,.55),transparent 62%),radial-gradient(60% 55% at 86% 92%,rgba(7,140,126,.42),transparent 62%),linear-gradient(140deg,#0B1F35 0%,#133F6C 55%,#0C2B38 100%)!important}

/* ════ PROPUESTA G: sin marco ════════════════════════════════════════════════════ */

/* ════ PROPUESTA H: en celular y tablet, la app como en el propio equipo ═══════════ */
/* el cuadro toma la forma del equipo del visitante con la app (vertical al sostenerlo así, horizontal al

/* ════ PROPUESTA I: el demo manda; el texto acompaña ═══════════════════════════════ */
/* el demo arriba, centrado y a todo el ancho; el texto del paso va debajo, como subtítulo; la etapa se
   lee en una etiqueta translúcida sobre el demo (.p-paso, la pone capa.js) */

#product .al-demo__grid{display:flex!important;flex-direction:column;gap:12px}
#product .al-demo__stage{order:-1!important;grid-column:auto!important;grid-row:auto!important;align-self:center!important;width:100%!important;max-width:1000px!important;margin:0 auto!important}
@media (pointer:fine){ #product .al-demo__stage{height:max(300px, min(56cqw, calc(100svh - 210px)))!important} }
#product .al-demo__copy{order:1;text-align:center;max-width:680px;margin:0 auto!important;min-height:0!important;padding:0!important}
#product .al-demo__kicker,#product .al-demo__stats,#product .al-demo__map{display:none!important}
#product .al-demo__title{font-size:clamp(15px,1.5vw,18px)!important;line-height:1.35!important;margin:0 0 .25rem!important;opacity:.92}
#product .al-demo__body{font-size:clamp(12.5px,1.1vw,14px)!important;line-height:1.5!important;opacity:.68;margin:0 auto!important}

#product .al-demo__note{grid-column:auto!important;grid-row:auto!important;text-align:center;opacity:.55;margin-top:.6rem!important}
.p-paso{position:absolute;left:12px;top:10px;z-index:5;pointer-events:none;padding:5px 11px;border-radius:999px;
  background:rgba(10,18,30,.42);-webkit-backdrop-filter:blur(10px) saturate(1.3);backdrop-filter:blur(10px) saturate(1.3);
  color:rgba(255,255,255,.92);font:600 10.5px/1.2 var(--mono,monospace);letter-spacing:.08em;text-transform:uppercase;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);transition:opacity .35s ease,transform .35s ease;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.p-paso.cambia{opacity:0;transform:translateY(-4px)}
@media (pointer:coarse){   /* en celular y tablet, fuera del equipo: centrada justo encima del demo */
  #product .al-demo__stage{overflow:visible!important;margin-top:30px!important}

  .p-paso.cambia{transform:translate(-50%,-4px)}
}

/* ════ PROPUESTA J: el texto acompaña, no compite ════════════════════════════════════ */

   ve en modo manual; al terminar, el resumen de los pasos sobre el demo (.p-resumen, la arma capa.js) */

.p-resumen{position:absolute;left:0;right:0;top:0;bottom:var(--al-barra);z-index:6;display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:18px;text-align:left;background:rgba(7,13,22,.74);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);
